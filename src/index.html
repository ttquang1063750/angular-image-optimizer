<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Mobile chrome/safari theme color, separate per scheme -->
    <meta name="theme-color" content="#c3002f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e2128" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA standalone capability — standard tag first, Apple-prefixed kept for iOS Safari compat -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Authorship -->
    <meta name="author" content="Tang Thanh Quang" />
    <meta name="generator" content="Angular" />

    <!--
      Resource hints. External resources chỉ reach khi user click GitHub link
      / PayPal CTA → dns-prefetch là đủ, không cần preconnect (giữ initial
      RTT cho asset của ta).
    -->
    <link rel="dns-prefetch" href="https://github.com" />
    <link rel="dns-prefetch" href="https://paypal.me" />

    <!-- SEO — app một trang, meta tĩnh. Ngôn ngữ đổi client-side qua language switcher. -->
    <title>App nén ảnh — Image Optimizer</title>
    <meta
      name="description"
      content="Công cụ nén và resize ảnh hàng loạt chạy trực tiếp trên trình duyệt của bạn."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://image-optimizer.js-tools.org/" />

    <!-- Open Graph -->
    <meta property="og:title" content="App nén ảnh — Image Optimizer" />
    <meta
      property="og:description"
      content="Công cụ nén và resize ảnh hàng loạt chạy trực tiếp trên trình duyệt của bạn."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://image-optimizer.js-tools.org/" />
    <meta property="og:image" content="https://image-optimizer.js-tools.org/og-image.png" />
    <meta property="og:locale" content="vi_VN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="App nén ảnh — Image Optimizer" />
    <meta
      name="twitter:description"
      content="Công cụ nén và resize ảnh hàng loạt chạy trực tiếp trên trình duyệt của bạn."
    />
    <meta name="twitter:image" content="https://image-optimizer.js-tools.org/og-image.png" />

    <!-- JSON-LD: SoftwareApplication schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Image Optimizer",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
